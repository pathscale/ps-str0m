[package]
name = "ps-str0m-rust-crypto"
version = "0.2.0"
authors = ["Martin Algesten <martin@algesten.se>"]
description = "Pure RustCrypto DTLS and SRTP provider for ps-str0m: ChaCha20-Poly1305 only"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/ps-str0m"
readme = "README.md"
keywords = ["webrtc", "dtls", "srtp", "cryptography"]
categories = ["cryptography", "network-programming", "multimedia"]
edition = "2024"

# MSRV
rust-version = "1.85.0"

[dependencies]
str0m-proto = { workspace = true, features = ["dtls"] }
dimpl = { workspace = true, features = ["rust-crypto"] }
hmac = "0.12.1"
hkdf = "0.12"
chacha20poly1305 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom", "std"] }
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["builder"] }

