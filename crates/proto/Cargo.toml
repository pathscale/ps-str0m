[package]
name = "ps-str0m-proto"
version = "0.8.0"
authors = ["Martin Algesten <martin@algesten.se>"]
description = "Internal protocol and crypto traits for ps-str0m. Not intended for direct use."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/ps-str0m"
readme = "README.md"
edition = "2024"

# MSRV
rust-version = "1.85.0"

[lib]
name = "str0m_proto"

[features]
default = ["dtls"]
dtls = ["dep:dimpl"]
pii = []

# When we are running in test mode
_internal_test_exports = []

[dependencies]
# DTLS made for str0m (optional dependency for types and traits)
dimpl = { workspace = true, optional = true }

time.workspace = true
base64ct.workspace = true
subtle.workspace = true
fastrand.workspace = true
serde.workspace = true

