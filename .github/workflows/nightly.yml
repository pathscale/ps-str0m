name: Nightly

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault

jobs:
  # Additional platform testing
  platform-build-test:
    name: ${{ matrix.platform.name }} - Build & Test
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: rust-crypto
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: rust-crypto
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            features: rust-crypto

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require runner rustup
        shell: bash
        run: command -v rustup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          key: ${{ matrix.platform.target }}

      - name: Build ${{ matrix.platform.name }}
        run: cargo +${{steps.toolchain.outputs.name}} build --target ${{ matrix.platform.target }} --no-default-features --features ${{ matrix.platform.features }}

      - name: Test ${{ matrix.platform.name }}
        run: cargo +${{steps.toolchain.outputs.name}} test --release --target ${{ matrix.platform.target }} --no-default-features --features ${{ matrix.platform.features }} --lib --bins --tests

  # Build-only for mobile platforms
  mobile-build:
    name: ${{ matrix.platform.name }} - Build Only
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        platform:
          # iOS targets - ARM64 only
          - name: iOS ARM64
            os: macos-latest
            target: aarch64-apple-ios
            features: rust-crypto
          # Android targets - ARM64 only
          - name: Android ARM64
            os: ubuntu-24.04
            target: aarch64-linux-android
            features: rust-crypto

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require runner rustup
        shell: bash
        run: command -v rustup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          key: ${{ matrix.platform.target }}

      - name: Configure runner Android NDK
        if: matrix.platform.target == 'aarch64-linux-android'
        shell: bash
        run: |
          ndk="${ANDROID_HOME:?Android SDK is missing}/ndk/27.3.13750724"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$bin/aarch64-linux-android21-clang"
          ar="$bin/llvm-ar"
          if [[ ! -x "$clang" || ! -x "$ar" ]]; then
            echo "::error::Required Android NDK 27.3.13750724 tools are missing from $ndk"
            exit 1
          fi
          {
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk"
            printf 'CC_aarch64_linux_android=%s\n' "$clang"
            printf 'AR_aarch64_linux_android=%s\n' "$ar"
            printf 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=%s\n' "$clang"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.platform.name }}
        run: cargo +${{steps.toolchain.outputs.name}} build --target ${{ matrix.platform.target }} --no-default-features --features ${{ matrix.platform.features }}

