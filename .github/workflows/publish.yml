name: Publish

# Select each crate to publish at the version in its manifest.
on:
  workflow_dispatch:
    inputs:
      publish_proto:
        description: Publish ps-str0m-proto at the version in crates/proto/Cargo.toml
        required: false
        type: boolean
        default: false
      publish_is:
        description: Publish ps-str0m-is at the version in crates/is/Cargo.toml
        required: false
        type: boolean
        default: false
      publish_rust_crypto:
        description: Publish ps-str0m-rust-crypto at the version in crypto/rust-crypto/Cargo.toml
        required: false
        type: boolean
        default: false
      publish_str0m:
        description: Publish ps-str0m at the version in Cargo.toml
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Require master
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish ps-str0m-proto
        if: inputs.publish_proto
        run: cargo publish --registry crates-io --manifest-path crates/proto/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ps-str0m-is
        if: inputs.publish_is
        run: cargo publish --registry crates-io --manifest-path crates/is/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ps-str0m-rust-crypto
        if: inputs.publish_rust_crypto
        run: cargo publish --registry crates-io --manifest-path crypto/rust-crypto/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ps-str0m
        if: inputs.publish_str0m
        run: cargo publish --registry crates-io --manifest-path Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
