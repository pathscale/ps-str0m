name: Publish

# Version bumps on main release the fork crates. Existing registry versions
# are skipped, so manifest-only edits and partial-release retries are safe.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - crates/proto/Cargo.toml
      - crates/is/Cargo.toml
      - crypto/rust-crypto/Cargo.toml
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - name: Publish ps-str0m-proto
        run: bun .github/scripts/publish.ts crates/proto/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ps-str0m-is
        run: bun .github/scripts/publish.ts crates/is/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ps-str0m-rust-crypto
        run: bun .github/scripts/publish.ts crypto/rust-crypto/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ps-str0m
        run: bun .github/scripts/publish.ts Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
